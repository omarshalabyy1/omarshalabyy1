<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="The system I build, bottom to top: sources feed the data layer; the data layer feeds the AI layer and the insight layer; both feed the automation layer; everything delivers business outcomes.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2027"/>
      <stop offset="0.5" stop-color="#203A43"/>
      <stop offset="1" stop-color="#2C5364"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; }
    .items { font-size: 14.5px; fill: #E2E8F0; }
    .cap { font-size: 11px; font-weight: 600; letter-spacing: 2.5px; fill: #94A3B8; }
    .flow { animation: flow 2s ease-in-out infinite; opacity: 0.25; }
    .f1 { animation-delay: 0s; } .f2 { animation-delay: 0.4s; } .f3 { animation-delay: 0.8s; } .f4 { animation-delay: 1.2s; }
    @keyframes flow { 0%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  </style>

  <rect width="900" height="450" rx="18" fill="url(#bg)"/>
  <text x="80" y="50" class="cap">FROM RAW DATA TO RESULTS</text>

  <!-- Outcomes -->
  <rect x="80" y="70" width="740" height="58" rx="10" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-opacity="0.6"/>
  <rect x="80" y="70" width="6" height="58" rx="3" fill="#2DD4BF"/>
  <text x="104" y="94" class="label" fill="#2DD4BF">BUSINESS OUTCOMES</text>
  <text x="104" y="115" class="items">Less manual work &#183; One trusted source of truth &#183; Faster decisions &#183; Answers on demand</text>

  <!-- Automation -->
  <rect x="80" y="144" width="740" height="58" rx="10" fill="#F59E0B" fill-opacity="0.10" stroke="#F59E0B" stroke-opacity="0.5"/>
  <rect x="80" y="144" width="6" height="58" rx="3" fill="#F59E0B"/>
  <text x="104" y="168" class="label" fill="#F59E0B">AUTOMATION LAYER</text>
  <text x="104" y="189" class="items">Scheduled workflows &#183; API integrations &#183; Browser automation &#183; Agents that take action</text>

  <!-- AI -->
  <rect x="80" y="218" width="365" height="58" rx="10" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.55"/>
  <rect x="80" y="218" width="6" height="58" rx="3" fill="#A855F7"/>
  <text x="104" y="242" class="label" fill="#C084FC">AI LAYER</text>
  <text x="104" y="263" class="items">RAG &#183; AI agents &#183; NLP &#183; LLM extraction</text>

  <!-- Insight -->
  <rect x="455" y="218" width="365" height="58" rx="10" fill="#22C55E" fill-opacity="0.10" stroke="#22C55E" stroke-opacity="0.5"/>
  <rect x="455" y="218" width="6" height="58" rx="3" fill="#22C55E"/>
  <text x="479" y="242" class="label" fill="#4ADE80">INSIGHT LAYER</text>
  <text x="479" y="263" class="items">Power BI &#183; Excel &#183; KPI dashboards</text>

  <!-- Data -->
  <rect x="80" y="292" width="740" height="58" rx="10" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.6"/>
  <rect x="80" y="292" width="6" height="58" rx="3" fill="#3B82F6"/>
  <text x="104" y="316" class="label" fill="#60A5FA">DATA LAYER</text>
  <text x="104" y="337" class="items">Pipelines &#183; Warehouse (bronze, silver, gold) &#183; Airflow orchestration &#183; Data quality</text>

  <!-- Sources -->
  <rect x="80" y="366" width="740" height="58" rx="10" fill="#94A3B8" fill-opacity="0.08" stroke="#94A3B8" stroke-opacity="0.4"/>
  <rect x="80" y="366" width="6" height="58" rx="3" fill="#94A3B8"/>
  <text x="104" y="390" class="label" fill="#CBD5E1">SOURCES</text>
  <text x="104" y="411" class="items">Databases &#183; ERP and CRM &#183; APIs &#183; Web portals &#183; Spreadsheets &#183; PDFs and documents</text>

  <!-- Upward flow chevrons, lighting up bottom to top -->
  <g fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path class="flow f1" d="M254 362l8-7 8 7"/>
    <path class="flow f1" d="M629 362l8-7 8 7"/>
    <path class="flow f2" d="M254 288l8-7 8 7"/>
    <path class="flow f2" d="M629 288l8-7 8 7"/>
    <path class="flow f3" d="M254 214l8-7 8 7"/>
    <path class="flow f3" d="M629 214l8-7 8 7"/>
    <path class="flow f4" d="M254 140l8-7 8 7"/>
    <path class="flow f4" d="M629 140l8-7 8 7"/>
  </g>
</svg>
