<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 672" width="1000" height="672" role="img" aria-label="Your data. Your AI. One system. Four layers, top to bottom: 01 Your data, wherever it lives today (Excel and CSV, POS and ERP, store and marketplace exports, APIs, PDFs and documents); 02 Data engineering layer (pipelines, cleaning, business rules, data warehouse, big data); 03 AI layer (RAG over your documents, LLM chatbots, AI agents, document AI); 04 Data analysis layer (Power BI dashboards, KPI reports, chat on web and WhatsApp, alerts). Beside them, the automation layer: Airflow runs every layer on schedule, collecting, cleaning, refreshing the warehouse and AI index, updating every dashboard, and retrying and alerting on its own.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .name { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .text { font-size: 13.5px; fill: #94A3B8; }
    .body { font-size: 13.5px; fill: #E2E8F0; }
    .no { font-size: 12.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .chip { font-size: 12px; font-weight: 600; fill: #E2E8F0; text-anchor: middle; }
  </style>
  <rect width="1000" height="672" rx="22" fill="url(#bg)"/>
  <rect x="30" y="30" width="680" height="134.0" rx="14" fill="#94A3B8" fill-opacity="0.08" stroke="#94A3B8" stroke-opacity="0.7"/><circle cx="68" cy="67.0" r="17" fill="#94A3B8" fill-opacity="0.35"/><text x="68" y="71.5" class="no">01</text><text x="100.0" y="56.0" class="name">Your data</text><text x="100.0" y="78.0" class="text">Wherever it lives today. Nothing has to be</text><text x="100.0" y="97.5" class="text">replaced.</text><rect x="388.0" y="50.0" width="108.0" height="26" rx="13" fill="#94A3B8" fill-opacity="0.12" stroke="#94A3B8" stroke-opacity="0.45"/><text x="442.0" y="67.5" class="chip">Excel and CSV</text><rect x="504.0" y="50.0" width="101.8" height="26" rx="13" fill="#94A3B8" fill-opacity="0.12" stroke="#94A3B8" stroke-opacity="0.45"/><text x="554.9" y="67.5" class="chip">POS and ERP</text><rect x="388.0" y="84.0" width="199.8" height="26" rx="13" fill="#94A3B8" fill-opacity="0.12" stroke="#94A3B8" stroke-opacity="0.45"/><text x="487.9" y="101.5" class="chip">Store and marketplace exports</text><rect x="595.8" y="84.0" width="50.8" height="26" rx="13" fill="#94A3B8" fill-opacity="0.12" stroke="#94A3B8" stroke-opacity="0.45"/><text x="621.1" y="101.5" class="chip">APIs</text><rect x="388.0" y="118.0" width="146.5" height="26" rx="13" fill="#94A3B8" fill-opacity="0.12" stroke="#94A3B8" stroke-opacity="0.45"/><text x="461.2" y="135.5" class="chip">PDFs and documents</text><rect x="30" y="190" width="680" height="159.5" rx="14" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-opacity="0.7"/><circle cx="68" cy="227.0" r="17" fill="#3B82F6" fill-opacity="0.35"/><text x="68" y="231.5" class="no">02</text><text x="100.0" y="216.0" class="name">Data engineering layer</text><text x="100.0" y="238.0" class="text">Most AI and reporting failures start with</text><text x="100.0" y="257.5" class="text">messy, scattered data. This layer</text><text x="100.0" y="277.0" class="text">collects, cleans and models it in one</text><text x="100.0" y="296.5" class="text">warehouse, with Spark and Kafka when</text><text x="100.0" y="316.0" class="text">the volume demands it.</text><rect x="388.0" y="239.8" width="76.5" height="26" rx="13" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.45"/><text x="426.2" y="257.2" class="chip">Pipelines</text><rect x="472.5" y="239.8" width="74.5" height="26" rx="13" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.45"/><text x="509.8" y="257.2" class="chip">Cleaning</text><rect x="555.0" y="239.8" width="109.5" height="26" rx="13" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.45"/><text x="609.8" y="257.2" class="chip">Business rules</text><rect x="388.0" y="273.8" width="116.2" height="26" rx="13" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.45"/><text x="446.1" y="291.2" class="chip">Data warehouse</text><rect x="512.2" y="273.8" width="71.2" height="26" rx="13" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.45"/><text x="547.9" y="291.2" class="chip">Big data</text><rect x="30" y="375.5" width="680" height="140.0" rx="14" fill="#A855F7" fill-opacity="0.08" stroke="#A855F7" stroke-opacity="0.7"/><circle cx="68" cy="412.5" r="17" fill="#A855F7" fill-opacity="0.35"/><text x="68" y="417.0" class="no">03</text><text x="100.0" y="401.5" class="name">AI layer</text><text x="100.0" y="423.5" class="text">AI that works because every layer</text><text x="100.0" y="443.0" class="text">beneath it does. LLMs read the same</text><text x="100.0" y="462.5" class="text">clean data and your documents, answer</text><text x="100.0" y="482.0" class="text">questions and act with your approval.</text><rect x="388.0" y="415.5" width="176.0" height="26" rx="13" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.45"/><text x="476.0" y="433.0" class="chip">RAG over your documents</text><rect x="572.0" y="415.5" width="101.8" height="26" rx="13" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.45"/><text x="622.9" y="433.0" class="chip">LLM chatbots</text><rect x="388.0" y="449.5" width="78.0" height="26" rx="13" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.45"/><text x="427.0" y="467.0" class="chip">AI agents</text><rect x="474.0" y="449.5" width="98.0" height="26" rx="13" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.45"/><text x="523.0" y="467.0" class="chip">Document AI</text><rect x="30" y="541.5" width="680" height="101.0" rx="14" fill="#14B8A6" fill-opacity="0.08" stroke="#14B8A6" stroke-opacity="0.7"/><circle cx="68" cy="578.5" r="17" fill="#14B8A6" fill-opacity="0.35"/><text x="68" y="583.0" class="no">04</text><text x="100.0" y="567.5" class="name">Data analysis layer</text><text x="100.0" y="589.5" class="text">Dashboards and answers your team uses</text><text x="100.0" y="609.0" class="text">every day to decide.</text><rect x="388.0" y="562.0" width="146.5" height="26" rx="13" fill="#14B8A6" fill-opacity="0.12" stroke="#14B8A6" stroke-opacity="0.45"/><text x="461.2" y="579.5" class="chip">Power BI dashboards</text><rect x="542.5" y="562.0" width="88.8" height="26" rx="13" fill="#14B8A6" fill-opacity="0.12" stroke="#14B8A6" stroke-opacity="0.45"/><text x="586.9" y="579.5" class="chip">KPI reports</text><rect x="388.0" y="596.0" width="182.0" height="26" rx="13" fill="#14B8A6" fill-opacity="0.12" stroke="#14B8A6" stroke-opacity="0.45"/><text x="479.0" y="613.5" class="chip">Chat on web and WhatsApp</text><rect x="578.0" y="596.0" width="58.2" height="26" rx="13" fill="#14B8A6" fill-opacity="0.12" stroke="#14B8A6" stroke-opacity="0.45"/><text x="607.1" y="613.5" class="chip">Alerts</text><line x1="68" y1="167.0" x2="68" y2="187.0" stroke="#64748B" stroke-width="2" stroke-dasharray="4 6"/><line x1="68" y1="352.5" x2="68" y2="372.5" stroke="#64748B" stroke-width="2" stroke-dasharray="4 6"/><line x1="68" y1="518.5" x2="68" y2="538.5" stroke="#64748B" stroke-width="2" stroke-dasharray="4 6"/><rect x="730" y="30" width="240" height="612.5" rx="14" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.7"/><circle cx="765" cy="67" r="17" fill="#38BDF8" fill-opacity="0.35"/><path d="M 772 62 A 8 8 0 1 0 773 70" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><path d="M 768 60 L 773 62 L 774 56" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="794.0" y="72.0" class="name">Automation layer</text><text x="748.0" y="110.0" class="text">Airflow runs every layer on</text><text x="748.0" y="129.5" class="text">schedule. Zero touch, every day.</text><line x1="748" y1="153.0" x2="952" y2="153.0" stroke="#38BDF8" stroke-opacity="0.25"/><path d="M 749 176.0 l 4 4 l 8 -9" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="770.0" y="181.0" class="body">Collects your data from every</text><text x="770.0" y="200.5" class="body">source</text><path d="M 749 224.0 l 4 4 l 8 -9" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="770.0" y="229.0" class="body">Cleans it and checks it</text><text x="770.0" y="248.5" class="body">against your rules</text><path d="M 749 272.0 l 4 4 l 8 -9" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="770.0" y="277.0" class="body">Refreshes the warehouse and</text><text x="770.0" y="296.5" class="body">the AI index</text><path d="M 749 320.0 l 4 4 l 8 -9" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="770.0" y="325.0" class="body">Updates every dashboard</text><path d="M 749 348.5 l 4 4 l 8 -9" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="770.0" y="353.5" class="body">Retries on its own and alerts</text><text x="770.0" y="373.0" class="body">you if something breaks</text><line x1="748" y1="395.5" x2="952" y2="395.5" stroke="#38BDF8" stroke-opacity="0.25"/><rect x="748.0" y="413.5" width="64.5" height="26" rx="13" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45"/><text x="780.2" y="431.0" class="chip">Airflow</text><rect x="820.5" y="413.5" width="65.0" height="26" rx="13" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45"/><text x="853.0" y="431.0" class="chip">Retries</text><rect x="893.5" y="413.5" width="58.2" height="26" rx="13" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45"/><text x="922.6" y="431.0" class="chip">Alerts</text>
</svg>
