<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1716" width="1000" height="1716" role="img" aria-label="Featured projects. Argus, by Null Labs AI Inc.: every retailer deduction matched, explained and ready to dispute. It collects every Walmart invoice, payment and deduction daily, matches each one to the cent in a PostgreSQL warehouse, classifies it with a rules knowledge base, and shows what to recover, prevent or accept by filing deadline. Waha Bosch Auto Service, a Bosch Car Service center: 50,000+ workshop Excel files turned into one source of truth, with a self-refreshing warehouse, names matched across every spelling, Power BI branch dashboards and cleaner Excel templates. Own project, order-to-cash analytics on a SAP extract: pandas exploration, a 5-layer SQL warehouse on DuckDB with 43 data checks and a Power BI report that shows 16,050 EUR waiting between order and cash.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .cap { font-size: 14px; fill: #94A3B8; }
    .name { font-size: 22px; font-weight: 700; fill: #FFFFFF; }
    .tag { font-size: 11.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .sub { font-size: 14px; font-weight: 600; }
    .lab { font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; }
    .body { font-size: 13.5px; fill: #E2E8F0; }
    .num { font-size: 15px; font-weight: 700; }
    .step { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .chip { font-size: 11.5px; font-weight: 600; fill: #CBD5E1; text-anchor: middle; }
  </style>
  <rect width="1000" height="1716" rx="22" fill="url(#bg)"/>
  <text x="30" y="44" class="title">Featured projects</text>
  <text x="30" y="68" class="cap">Real systems, real business problems.</text>
  <rect x="30" y="92.0" width="940" height="735.5" rx="16" fill="#14B8A6" fill-opacity="0.07" stroke="#14B8A6" stroke-opacity="0.6"/><rect x="30" y="92.0" width="940" height="6" rx="3" fill="#14B8A6"/><text x="56.0" y="138.0" class="name">Every retailer deduction matched, explained and ready to dispute</text><text x="56.0" y="168.0" class="sub" fill="#14B8A6">Null Labs AI Inc.  ·  Argus</text><rect x="56.0" y="184.0" width="117.5" height="24" rx="12" fill="#3B82F6" fill-opacity="0.22" stroke="#3B82F6" stroke-opacity="0.8"/><text x="114.8" y="200.0" class="tag">Data engineering</text><rect x="181.5" y="184.0" width="89.0" height="24" rx="12" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-opacity="0.8"/><text x="226.0" y="200.0" class="tag">Automation</text><rect x="278.5" y="184.0" width="95.0" height="24" rx="12" fill="#0EA5E9" fill-opacity="0.22" stroke="#0EA5E9" stroke-opacity="0.8"/><text x="326.0" y="200.0" class="tag">Data analysis</text><text x="56.0" y="242.0" class="lab" fill="#F87171">THE PROBLEM</text><text x="56.0" y="263.0" class="body">Suppliers lose money to deductions taken out of their Walmart</text><text x="56.0" y="282.5" class="body">payments, and most can&#x27;t tell which ones are wrong before the</text><text x="56.0" y="302.0" class="body">dispute window closes.</text><text x="56.0" y="337.5" class="lab" fill="#38BDF8">THE SOLUTION</text><text x="56.0" y="358.5" class="body">Argus runs the supplier&#x27;s Walmart account on one screen. It collects</text><text x="56.0" y="378.0" class="body">every invoice, payment and deduction daily, matches each one to the</text><text x="56.0" y="397.5" class="body">cent, explains it, and flags the ones worth disputing.</text><text x="506.0" y="242.0" class="lab" fill="#34D399">THE IMPACT</text><circle cx="511" cy="258.5" r="3.5" fill="#14B8A6"/><text x="524.0" y="263.0" class="body">Every deduction matched to its invoice and classified every</text><text x="524.0" y="282.5" class="body">morning, with no manual digging.</text><circle cx="511" cy="304.5" r="3.5" fill="#14B8A6"/><text x="524.0" y="309.0" class="body">Disputes filed inside the window, with their evidence, and</text><text x="524.0" y="328.5" class="body">approved by a person.</text><circle cx="511" cy="350.5" r="3.5" fill="#14B8A6"/><text x="524.0" y="355.0" class="body">Repeat causes visible by distribution center, item and carrier, so</text><text x="524.0" y="374.5" class="body">they get fixed upstream.</text><circle cx="511" cy="396.5" r="3.5" fill="#14B8A6"/><text x="524.0" y="401.0" class="body">One working list for the team: recover, prevent or accept, sorted by</text><text x="524.0" y="420.5" class="body">deadline.</text><text x="56.0" y="465.0" class="lab" fill="#14B8A6">HOW IT WORKS</text><rect x="56.0" y="479.0" width="286.7" height="110.5" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="72.0" y="505.0" class="num" fill="#14B8A6">01</text><text x="102.0" y="505.0" class="step">Collect</text><text x="72.0" y="529.0" class="body">Invoice, payment and dispute records</text><text x="72.0" y="548.5" class="body">from Walmart&#x27;s supplier API and portals,</text><text x="72.0" y="568.0" class="body">every day</text><rect x="356.7" y="479.0" width="286.7" height="110.5" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="372.7" y="505.0" class="num" fill="#14B8A6">02</text><text x="402.7" y="505.0" class="step">Store</text><text x="372.7" y="529.0" class="body">A PostgreSQL warehouse with raw,</text><text x="372.7" y="548.5" class="body">cleaned and reporting layers</text><rect x="657.4" y="479.0" width="286.7" height="110.5" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="673.4" y="505.0" class="num" fill="#14B8A6">03</text><text x="703.4" y="505.0" class="step">Match</text><text x="673.4" y="529.0" class="body">Every short payment matched to its</text><text x="673.4" y="548.5" class="body">invoice, to the cent</text><rect x="56.0" y="603.5" width="286.7" height="130.0" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="72.0" y="629.5" class="num" fill="#14B8A6">04</text><text x="102.0" y="629.5" class="step">Classify</text><text x="72.0" y="653.5" class="body">A rules knowledge base maps each</text><text x="72.0" y="673.0" class="body">deduction by code and root cause, and</text><text x="72.0" y="692.5" class="body">says whether it is worth disputing</text><rect x="356.7" y="603.5" width="286.7" height="130.0" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="372.7" y="629.5" class="num" fill="#14B8A6">05</text><text x="402.7" y="629.5" class="step">Decide</text><text x="372.7" y="653.5" class="body">Dashboards show what to recover,</text><text x="372.7" y="673.0" class="body">prevent or accept, sorted by filing</text><text x="372.7" y="692.5" class="body">deadline, and the team approves every</text><text x="372.7" y="712.0" class="body">filing</text><text x="56.0" y="765.5" class="lab" fill="#94A3B8">STACK</text><rect x="56.0" y="777.5" width="60.8" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="86.4" y="793.5" class="chip">Python</text><rect x="123.8" y="777.5" width="84.5" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="166.0" y="793.5" class="chip">PostgreSQL</text><rect x="215.2" y="777.5" width="61.8" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="246.1" y="793.5" class="chip">Airflow</text><rect x="284.0" y="777.5" width="80.2" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="324.1" y="793.5" class="chip">Playwright</text><rect x="371.2" y="777.5" width="71.5" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="407.0" y="793.5" class="chip">Streamlit</text><rect x="30" y="851.5" width="940" height="405.0" rx="16" fill="#F2C811" fill-opacity="0.07" stroke="#F2C811" stroke-opacity="0.6"/><rect x="30" y="851.5" width="940" height="6" rx="3" fill="#F2C811"/><text x="56.0" y="897.5" class="name">50,000+ workshop Excel files turned into one source of truth</text><text x="56.0" y="927.5" class="sub" fill="#F2C811">Waha Bosch Auto Service  ·  Bosch Car Service center</text><rect x="56.0" y="943.5" width="117.5" height="24" rx="12" fill="#3B82F6" fill-opacity="0.22" stroke="#3B82F6" stroke-opacity="0.8"/><text x="114.8" y="959.5" class="tag">Data engineering</text><rect x="181.5" y="943.5" width="95.0" height="24" rx="12" fill="#0EA5E9" fill-opacity="0.22" stroke="#0EA5E9" stroke-opacity="0.8"/><text x="229.0" y="959.5" class="tag">Data analysis</text><text x="56.0" y="1001.5" class="lab" fill="#F87171">THE PROBLEM</text><text x="56.0" y="1022.5" class="body">A three-branch car-service business ran on 50,000+ Excel files, with</text><text x="56.0" y="1042.0" class="body">the same customer, car or part written many ways and transfer</text><text x="56.0" y="1061.5" class="body">receipts arriving as phone screenshots.</text><text x="56.0" y="1097.0" class="lab" fill="#38BDF8">THE SOLUTION</text><text x="56.0" y="1118.0" class="body">One pipeline reads every invoice and daily sheet, cleans the names</text><text x="56.0" y="1137.5" class="body">and loads a warehouse that refreshes itself, with Power BI dashboards</text><text x="56.0" y="1157.0" class="body">on top.</text><text x="506.0" y="1001.5" class="lab" fill="#34D399">THE IMPACT</text><circle cx="511" cy="1018.0" r="3.5" fill="#F2C811"/><text x="524.0" y="1022.5" class="body">50,000+ scattered files turned into one source of truth.</text><circle cx="511" cy="1044.5" r="3.5" fill="#F2C811"/><text x="524.0" y="1049.0" class="body">The same customer, car or part recognised across every spelling.</text><circle cx="511" cy="1071.0" r="3.5" fill="#F2C811"/><text x="524.0" y="1075.5" class="body">Branch performance on Power BI dashboards.</text><circle cx="511" cy="1097.5" r="3.5" fill="#F2C811"/><text x="524.0" y="1102.0" class="body">Improved Excel templates, so new data arrives clean.</text><text x="56.0" y="1194.5" class="lab" fill="#94A3B8">STACK</text><rect x="56.0" y="1206.5" width="60.8" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="86.4" y="1222.5" class="chip">Python</text><rect x="123.8" y="1206.5" width="84.5" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="166.0" y="1222.5" class="chip">PostgreSQL</text><rect x="215.2" y="1206.5" width="61.8" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="246.1" y="1222.5" class="chip">Airflow</text><rect x="284.0" y="1206.5" width="70.2" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="319.1" y="1222.5" class="chip">Power BI</text><rect x="361.2" y="1206.5" width="49.2" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="385.9" y="1222.5" class="chip">Excel</text><rect x="30" y="1280.5" width="940" height="405.0" rx="16" fill="#3B82F6" fill-opacity="0.07" stroke="#3B82F6" stroke-opacity="0.6"/><rect x="30" y="1280.5" width="940" height="6" rx="3" fill="#3B82F6"/><text x="56.0" y="1326.5" class="name">Order-to-cash analytics on a SAP extract</text><text x="56.0" y="1356.5" class="sub" fill="#3B82F6">Own project  ·  Order-to-cash case study</text><rect x="56.0" y="1372.5" width="141.0" height="24" rx="12" fill="#3B82F6" fill-opacity="0.22" stroke="#3B82F6" stroke-opacity="0.8"/><text x="126.5" y="1388.5" class="tag">Analytics engineering</text><rect x="205.0" y="1372.5" width="104.0" height="24" rx="12" fill="#14B8A6" fill-opacity="0.22" stroke="#14B8A6" stroke-opacity="0.8"/><text x="257.0" y="1388.5" class="tag">Data modeling</text><rect x="317.0" y="1372.5" width="90.2" height="24" rx="12" fill="#0EA5E9" fill-opacity="0.22" stroke="#0EA5E9" stroke-opacity="0.8"/><text x="362.1" y="1388.5" class="tag">Data quality</text><rect x="415.2" y="1372.5" width="72.2" height="24" rx="12" fill="#CA8A04" fill-opacity="0.22" stroke="#CA8A04" stroke-opacity="0.8"/><text x="451.4" y="1388.5" class="tag">Power BI</text><text x="56.0" y="1430.5" class="lab" fill="#F87171">THE PROBLEM</text><text x="56.0" y="1451.5" class="body">A SAP order-to-cash extract in 15 raw tables (orders, deliveries,</text><text x="56.0" y="1471.0" class="body">invoices, open and paid items) with no single view of where money</text><text x="56.0" y="1490.5" class="body">waits between order and cash.</text><text x="56.0" y="1526.0" class="lab" fill="#38BDF8">THE SOLUTION</text><text x="56.0" y="1547.0" class="body">pandas exploration first, then a 5-layer SQL warehouse on DuckDB</text><text x="56.0" y="1566.5" class="body">(Bronze, Silver, Gold, a star schema and one mart per department)</text><text x="56.0" y="1586.0" class="body">with 43 data checks, and a Power BI report that reads the marts only.</text><text x="506.0" y="1430.5" class="lab" fill="#34D399">THE IMPACT</text><circle cx="511" cy="1447.0" r="3.5" fill="#3B82F6"/><text x="524.0" y="1451.5" class="body">16,050 EUR shown waiting between order and cash.</text><circle cx="511" cy="1473.5" r="3.5" fill="#3B82F6"/><text x="524.0" y="1478.0" class="body">4,350 EUR ordered but not shipped, 4,200 EUR shipped but not</text><text x="524.0" y="1497.5" class="body">billed, 7,500 EUR billed but not paid.</text><circle cx="511" cy="1519.5" r="3.5" fill="#3B82F6"/><text x="524.0" y="1524.0" class="body">89 raw rows modeled into a star schema of 3 facts and 7</text><text x="524.0" y="1543.5" class="body">dimensions.</text><circle cx="511" cy="1565.5" r="3.5" fill="#3B82F6"/><text x="524.0" y="1570.0" class="body">43 data checks, all passing, behind a 5-page Power BI report.</text><text x="56.0" y="1623.5" class="lab" fill="#94A3B8">STACK</text><rect x="56.0" y="1635.5" width="60.8" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="86.4" y="1651.5" class="chip">Python</text><rect x="123.8" y="1635.5" width="60.8" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="154.1" y="1651.5" class="chip">pandas</text><rect x="191.5" y="1635.5" width="43.2" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="213.1" y="1651.5" class="chip">SQL</text><rect x="241.8" y="1635.5" width="65.2" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="274.4" y="1651.5" class="chip">DuckDB</text><rect x="314.0" y="1635.5" width="70.2" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="349.1" y="1651.5" class="chip">Power BI</text>
</svg>
