<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120" width="1000" height="1120" role="img" aria-label="Featured projects. Argus, by Null Labs AI Inc.: Walmart deductions matched to the cent. A daily pipeline into a layered PostgreSQL warehouse matches every deduction to its invoice and classifies it; dashboards sort what to recover, prevent or accept by deadline. Waha Bosch Auto Service: 50,000+ files into one self-refreshing warehouse, names matched across spellings, branch KPIs in Power BI.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .cap { font-size: 14px; fill: #94A3B8; }
    .name { font-size: 22px; font-weight: 700; fill: #FFFFFF; }
    .tag { font-size: 11.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .sub { font-size: 14px; font-weight: 600; }
    .lab { font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; }
    .body { font-size: 13.5px; fill: #E2E8F0; }
    .num { font-size: 15px; font-weight: 700; }
    .step { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .chip { font-size: 11.5px; font-weight: 600; fill: #CBD5E1; text-anchor: middle; }
  </style>
  <rect width="1000" height="1120" rx="22" fill="url(#bg)"/>
  <text x="30" y="44" class="title">Featured projects</text>
  <text x="30" y="68" class="cap">Real systems, real business problems.</text>
  <rect x="30" y="92.0" width="940" height="608.0" rx="16" fill="#14B8A6" fill-opacity="0.07" stroke="#14B8A6" stroke-opacity="0.6"/><rect x="30" y="92.0" width="940" height="6" rx="3" fill="#14B8A6"/><text x="56.0" y="138.0" class="name">Walmart deductions matched to the cent</text><text x="56.0" y="168.0" class="sub" fill="#14B8A6">Null Labs AI Inc.  ·  Argus</text><rect x="56.0" y="184.0" width="141.0" height="24" rx="12" fill="#3B82F6" fill-opacity="0.22" stroke="#3B82F6" stroke-opacity="0.8"/><text x="126.5" y="200.0" class="tag">Analytics engineering</text><rect x="205.0" y="184.0" width="104.0" height="24" rx="12" fill="#14B8A6" fill-opacity="0.22" stroke="#14B8A6" stroke-opacity="0.8"/><text x="257.0" y="200.0" class="tag">Data modeling</text><rect x="317.0" y="184.0" width="90.2" height="24" rx="12" fill="#0EA5E9" fill-opacity="0.22" stroke="#0EA5E9" stroke-opacity="0.8"/><text x="362.1" y="200.0" class="tag">Data quality</text><text x="56.0" y="242.0" class="lab" fill="#F87171">THE PROBLEM</text><text x="56.0" y="263.0" class="body">Suppliers can&#x27;t tell which Walmart deductions are wrong before the</text><text x="56.0" y="282.5" class="body">dispute window closes.</text><text x="56.0" y="318.0" class="lab" fill="#38BDF8">THE SOLUTION</text><text x="56.0" y="339.0" class="body">One layered PostgreSQL warehouse, loaded daily from Walmart, feeds</text><text x="56.0" y="358.5" class="body">four systems.</text><text x="506.0" y="242.0" class="lab" fill="#34D399">THE IMPACT</text><circle cx="511" cy="258.5" r="3.5" fill="#14B8A6"/><text x="524.0" y="263.0" class="body">Every deduction matched to the cent, every morning.</text><circle cx="511" cy="285.0" r="3.5" fill="#14B8A6"/><text x="524.0" y="289.5" class="body">Disputes filed on time, with evidence.</text><circle cx="511" cy="311.5" r="3.5" fill="#14B8A6"/><text x="524.0" y="316.0" class="body">Recover, prevent or accept, sorted by deadline.</text><text x="56.0" y="396.0" class="lab" fill="#14B8A6">FOUR SYSTEMS</text><rect x="56.0" y="410.0" width="437.04999999999995" height="91.0" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="72.0" y="436.0" class="num" fill="#14B8A6">01</text><text x="102.0" y="436.0" class="step">Deductions &amp; disputes</text><text x="72.0" y="460.0" class="body">Every deduction classified by code and root cause; disputes filed on</text><text x="72.0" y="479.5" class="body">time, with evidence</text><rect x="507.0" y="410.0" width="437.04999999999995" height="91.0" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="523.0" y="436.0" class="num" fill="#14B8A6">02</text><text x="553.0" y="436.0" class="step">PO tracker</text><text x="523.0" y="460.0" class="body">Every purchase order tracked from order to payment</text><rect x="56.0" y="515.0" width="437.04999999999995" height="91.0" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="72.0" y="541.0" class="num" fill="#14B8A6">03</text><text x="102.0" y="541.0" class="step">Reconciliation</text><text x="72.0" y="565.0" class="body">Payments matched to invoices, to the cent, every day</text><rect x="507.0" y="515.0" width="437.04999999999995" height="91.0" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="523.0" y="541.0" class="num" fill="#14B8A6">04</text><text x="553.0" y="541.0" class="step">Prevention</text><text x="523.0" y="565.0" class="body">Repeat causes by distribution center, item and carrier, fixed</text><text x="523.0" y="584.5" class="body">upstream</text><text x="56.0" y="638.0" class="lab" fill="#94A3B8">STACK</text><rect x="56.0" y="650.0" width="60.8" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="86.4" y="666.0" class="chip">Python</text><rect x="123.8" y="650.0" width="84.5" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="166.0" y="666.0" class="chip">PostgreSQL</text><rect x="215.2" y="650.0" width="61.8" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="246.1" y="666.0" class="chip">Airflow</text><rect x="284.0" y="650.0" width="80.2" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="324.1" y="666.0" class="chip">Playwright</text><rect x="371.2" y="650.0" width="71.5" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="407.0" y="666.0" class="chip">Streamlit</text><rect x="30" y="724.0" width="940" height="366.0" rx="16" fill="#F2C811" fill-opacity="0.07" stroke="#F2C811" stroke-opacity="0.6"/><rect x="30" y="724.0" width="940" height="6" rx="3" fill="#F2C811"/><text x="56.0" y="770.0" class="name">50,000+ files into one warehouse</text><text x="56.0" y="800.0" class="sub" fill="#F2C811">Waha Bosch Auto Service  ·  Bosch Car Service center</text><rect x="56.0" y="816.0" width="141.0" height="24" rx="12" fill="#3B82F6" fill-opacity="0.22" stroke="#3B82F6" stroke-opacity="0.8"/><text x="126.5" y="832.0" class="tag">Analytics engineering</text><rect x="205.0" y="816.0" width="104.0" height="24" rx="12" fill="#14B8A6" fill-opacity="0.22" stroke="#14B8A6" stroke-opacity="0.8"/><text x="257.0" y="832.0" class="tag">Data modeling</text><rect x="317.0" y="816.0" width="72.2" height="24" rx="12" fill="#CA8A04" fill-opacity="0.22" stroke="#CA8A04" stroke-opacity="0.8"/><text x="353.1" y="832.0" class="tag">Power BI</text><text x="56.0" y="874.0" class="lab" fill="#F87171">THE PROBLEM</text><text x="56.0" y="895.0" class="body">Three branches ran on 50,000+ Excel files, with the same names</text><text x="56.0" y="914.5" class="body">spelled many ways.</text><text x="56.0" y="950.0" class="lab" fill="#38BDF8">THE SOLUTION</text><text x="56.0" y="971.0" class="body">One pipeline cleans and loads a self-refreshing warehouse, with Power</text><text x="56.0" y="990.5" class="body">BI on top.</text><text x="506.0" y="874.0" class="lab" fill="#34D399">THE IMPACT</text><circle cx="511" cy="890.5" r="3.5" fill="#F2C811"/><text x="524.0" y="895.0" class="body">One source of truth for all branches.</text><circle cx="511" cy="917.0" r="3.5" fill="#F2C811"/><text x="524.0" y="921.5" class="body">Customers, cars and parts matched across spellings.</text><circle cx="511" cy="943.5" r="3.5" fill="#F2C811"/><text x="524.0" y="948.0" class="body">Branch KPIs in Power BI.</text><text x="56.0" y="1028.0" class="lab" fill="#94A3B8">STACK</text><rect x="56.0" y="1040.0" width="60.8" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="86.4" y="1056.0" class="chip">Python</text><rect x="123.8" y="1040.0" width="84.5" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="166.0" y="1056.0" class="chip">PostgreSQL</text><rect x="215.2" y="1040.0" width="61.8" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="246.1" y="1056.0" class="chip">Airflow</text><rect x="284.0" y="1040.0" width="70.2" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="319.1" y="1056.0" class="chip">Power BI</text>
</svg>
