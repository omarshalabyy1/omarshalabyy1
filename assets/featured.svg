<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1296" width="1000" height="1296" role="img" aria-label="Featured projects. Argus, by Null Labs AI Inc.: every retailer deduction matched, explained and ready to dispute. It collects every Walmart invoice, payment and deduction daily, matches each one to the cent in a PostgreSQL warehouse, classifies it with a rules knowledge base, drafts disputes with LLM agents and a RAG assistant, and shows what to recover, prevent or accept by filing deadline. Waha Bosch Auto Service, a Bosch Car Service center: about 47,000 workshop Excel files turned into one source of truth and an AI assistant, with a self-refreshing warehouse, names matched across Arabic and English, Power BI branch dashboards and cleaner Excel templates.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .cap { font-size: 14px; fill: #94A3B8; }
    .name { font-size: 22px; font-weight: 700; fill: #FFFFFF; }
    .tag { font-size: 11.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .sub { font-size: 14px; font-weight: 600; }
    .lab { font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; }
    .body { font-size: 13.5px; fill: #E2E8F0; }
    .num { font-size: 15px; font-weight: 700; }
    .step { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .chip { font-size: 11.5px; font-weight: 600; fill: #CBD5E1; text-anchor: middle; }
  </style>
  <rect width="1000" height="1296" rx="22" fill="url(#bg)"/>
  <text x="30" y="44" class="title">Featured projects</text>
  <text x="30" y="68" class="cap">Real systems, real business problems.</text>
  <rect x="30" y="92" width="940" height="737.5" rx="16" fill="#14B8A6" fill-opacity="0.07" stroke="#14B8A6" stroke-opacity="0.6"/><rect x="30" y="92" width="940" height="6" rx="3" fill="#14B8A6"/><text x="56.0" y="138.0" class="name">Every retailer deduction matched, explained and ready to dispute</text><text x="56.0" y="168.0" class="sub" fill="#14B8A6">Null Labs AI Inc.  ·  Argus</text><rect x="56.0" y="184.0" width="117.8" height="24" rx="12" fill="#3B82F6" fill-opacity="0.22" stroke="#3B82F6" stroke-opacity="0.8"/><text x="114.9" y="200.0" class="tag">Data engineering</text><rect x="181.8" y="184.0" width="151.0" height="24" rx="12" fill="#A855F7" fill-opacity="0.22" stroke="#A855F7" stroke-opacity="0.8"/><text x="257.2" y="200.0" class="tag">AI agents and chatbots</text><rect x="340.8" y="184.0" width="99.2" height="24" rx="12" fill="#8B5CF6" fill-opacity="0.22" stroke="#8B5CF6" stroke-opacity="0.8"/><text x="390.4" y="200.0" class="tag">RAG systems</text><rect x="448.0" y="184.0" width="87.8" height="24" rx="12" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-opacity="0.8"/><text x="491.9" y="200.0" class="tag">Automation</text><rect x="543.8" y="184.0" width="98.2" height="24" rx="12" fill="#0EA5E9" fill-opacity="0.22" stroke="#0EA5E9" stroke-opacity="0.8"/><text x="592.9" y="200.0" class="tag">Data analysis</text><text x="56.0" y="242.0" class="lab" fill="#F87171">THE PROBLEM</text><text x="56.0" y="263.0" class="body">Suppliers lose money to deductions taken out of their Walmart</text><text x="56.0" y="282.5" class="body">payments, and most can't tell which ones are wrong before the</text><text x="56.0" y="302.0" class="body">dispute window closes.</text><text x="56.0" y="337.5" class="lab" fill="#38BDF8">THE SOLUTION</text><text x="56.0" y="358.5" class="body">Argus runs the supplier's Walmart account on one screen. It collects</text><text x="56.0" y="378.0" class="body">every invoice, payment and deduction daily, matches each one to</text><text x="56.0" y="397.5" class="body">the cent, explains it, and drafts the dispute when it is worth fighting.</text><text x="506.0" y="242.0" class="lab" fill="#34D399">THE IMPACT</text><circle cx="511" cy="258.5" r="3.5" fill="#14B8A6"/><text x="524.0" y="263.0" class="body">Every deduction matched to its invoice and classified every morning,</text><text x="524.0" y="282.5" class="body">with no manual digging.</text><circle cx="511" cy="304.5" r="3.5" fill="#14B8A6"/><text x="524.0" y="309.0" class="body">Disputes filed inside the window, drafted with their evidence and</text><text x="524.0" y="328.5" class="body">approved by a person.</text><circle cx="511" cy="350.5" r="3.5" fill="#14B8A6"/><text x="524.0" y="355.0" class="body">Repeat causes visible by distribution center, item and carrier, so they</text><text x="524.0" y="374.5" class="body">get fixed upstream.</text><circle cx="511" cy="396.5" r="3.5" fill="#14B8A6"/><text x="524.0" y="401.0" class="body">One working list for the team: recover, prevent or accept, sorted by</text><text x="524.0" y="420.5" class="body">deadline.</text><text x="56.0" y="466.0" class="lab" fill="#14B8A6">HOW IT WORKS</text><rect x="56.0" y="480.0" width="286.7" height="111.0" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="72.0" y="506.0" class="num" fill="#14B8A6">01</text><text x="102.0" y="506.0" class="step">Collect</text><text x="72.0" y="530.0" class="body">Invoice, payment and dispute records</text><text x="72.0" y="549.5" class="body">from Walmart's supplier API and portals,</text><text x="72.0" y="569.0" class="body">every day</text><rect x="356.7" y="480.0" width="286.7" height="111.0" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="372.7" y="506.0" class="num" fill="#14B8A6">02</text><text x="402.7" y="506.0" class="step">Store</text><text x="372.7" y="530.0" class="body">A PostgreSQL warehouse with raw,</text><text x="372.7" y="549.5" class="body">cleaned and reporting layers</text><rect x="657.3" y="480.0" width="286.7" height="111.0" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="673.3" y="506.0" class="num" fill="#14B8A6">03</text><text x="703.3" y="506.0" class="step">Match</text><text x="673.3" y="530.0" class="body">Every short payment matched to its</text><text x="673.3" y="549.5" class="body">invoice, to the cent</text><rect x="56.0" y="605.0" width="286.7" height="130.5" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="72.0" y="631.0" class="num" fill="#14B8A6">04</text><text x="102.0" y="631.0" class="step">Classify</text><text x="72.0" y="655.0" class="body">A rules knowledge base maps each</text><text x="72.0" y="674.5" class="body">deduction by code and root cause, and</text><text x="72.0" y="694.0" class="body">says whether it is worth disputing</text><rect x="356.7" y="605.0" width="286.7" height="130.5" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="372.7" y="631.0" class="num" fill="#14B8A6">05</text><text x="402.7" y="631.0" class="step">Draft</text><text x="372.7" y="655.0" class="body">LLM agents draft each dispute with its</text><text x="372.7" y="674.5" class="body">evidence, and a RAG assistant answers</text><text x="372.7" y="694.0" class="body">why any deduction happened, quoting</text><text x="372.7" y="713.5" class="body">Walmart's rules and the contract</text><rect x="657.3" y="605.0" width="286.7" height="130.5" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#14B8A6" stroke-opacity="0.35"/><text x="673.3" y="631.0" class="num" fill="#14B8A6">06</text><text x="703.3" y="631.0" class="step">Decide</text><text x="673.3" y="655.0" class="body">Dashboards show what to recover,</text><text x="673.3" y="674.5" class="body">prevent or accept, sorted by filing</text><text x="673.3" y="694.0" class="body">deadline, and the team approves every</text><text x="673.3" y="713.5" class="body">filing</text><text x="56.0" y="767.5" class="lab" fill="#94A3B8">STACK</text><rect x="56.0" y="779.5" width="59.0" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="85.5" y="795.5" class="chip">Python</text><rect x="122.0" y="779.5" width="86.8" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="165.4" y="795.5" class="chip">PostgreSQL</text><rect x="215.8" y="779.5" width="59.0" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="245.2" y="795.5" class="chip">Airflow</text><rect x="281.8" y="779.5" width="78.5" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="321.0" y="795.5" class="chip">Playwright</text><rect x="367.2" y="779.5" width="84.0" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="409.2" y="795.5" class="chip">LLM agents</text><rect x="458.2" y="779.5" width="45.5" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="481.0" y="795.5" class="chip">RAG</text><rect x="510.8" y="779.5" width="69.5" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="545.5" y="795.5" class="chip">Streamlit</text><rect x="30" y="853.5" width="940" height="413.0" rx="16" fill="#F2C811" fill-opacity="0.07" stroke="#F2C811" stroke-opacity="0.6"/><rect x="30" y="853.5" width="940" height="6" rx="3" fill="#F2C811"/><text x="56.0" y="899.5" class="name">47,000 workshop Excel files turned into one source of truth and an AI assistant</text><text x="56.0" y="929.5" class="sub" fill="#F2C811">Waha Bosch Auto Service  ·  Bosch Car Service center</text><rect x="56.0" y="945.5" width="117.8" height="24" rx="12" fill="#3B82F6" fill-opacity="0.22" stroke="#3B82F6" stroke-opacity="0.8"/><text x="114.9" y="961.5" class="tag">Data engineering</text><rect x="181.8" y="945.5" width="151.0" height="24" rx="12" fill="#A855F7" fill-opacity="0.22" stroke="#A855F7" stroke-opacity="0.8"/><text x="257.2" y="961.5" class="tag">AI agents and chatbots</text><rect x="340.8" y="945.5" width="98.2" height="24" rx="12" fill="#0EA5E9" fill-opacity="0.22" stroke="#0EA5E9" stroke-opacity="0.8"/><text x="389.9" y="961.5" class="tag">Data analysis</text><text x="56.0" y="1003.5" class="lab" fill="#F87171">THE PROBLEM</text><text x="56.0" y="1024.5" class="body">A three-branch car-service business ran on about 47,000 Excel files,</text><text x="56.0" y="1044.0" class="body">with the same customer, car or part written many ways and transfer</text><text x="56.0" y="1063.5" class="body">receipts arriving as WhatsApp screenshots.</text><text x="56.0" y="1099.0" class="lab" fill="#38BDF8">THE SOLUTION</text><text x="56.0" y="1120.0" class="body">One pipeline reads every invoice and daily sheet, cleans the names</text><text x="56.0" y="1139.5" class="body">and loads a warehouse that refreshes itself, with dashboards and an</text><text x="56.0" y="1159.0" class="body">assistant on top.</text><text x="506.0" y="1003.5" class="lab" fill="#34D399">THE IMPACT</text><circle cx="511" cy="1020.0" r="3.5" fill="#F2C811"/><text x="524.0" y="1024.5" class="body">About 47,000 scattered files turned into one source of truth.</text><circle cx="511" cy="1046.5" r="3.5" fill="#F2C811"/><text x="524.0" y="1051.0" class="body">The same customer, car or part recognised across Arabic and English</text><text x="524.0" y="1070.5" class="body">spellings.</text><circle cx="511" cy="1092.5" r="3.5" fill="#F2C811"/><text x="524.0" y="1097.0" class="body">Branch performance on Power BI dashboards, and an assistant that</text><text x="524.0" y="1116.5" class="body">answers from the data and price lists.</text><circle cx="511" cy="1138.5" r="3.5" fill="#F2C811"/><text x="524.0" y="1143.0" class="body">Improved Excel templates, so new data arrives clean.</text><text x="56.0" y="1204.5" class="lab" fill="#94A3B8">STACK</text><rect x="56.0" y="1216.5" width="59.0" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="85.5" y="1232.5" class="chip">Python</text><rect x="122.0" y="1216.5" width="86.8" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="165.4" y="1232.5" class="chip">PostgreSQL</text><rect x="215.8" y="1216.5" width="59.0" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="245.2" y="1232.5" class="chip">Airflow</text><rect x="281.8" y="1216.5" width="45.5" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="304.5" y="1232.5" class="chip">RAG</text><rect x="334.2" y="1216.5" width="84.0" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="376.2" y="1232.5" class="chip">LLM agents</text><rect x="425.2" y="1216.5" width="69.5" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="460.0" y="1232.5" class="chip">Power BI</text><rect x="501.8" y="1216.5" width="50.5" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="527.0" y="1232.5" class="chip">Excel</text>
</svg>
