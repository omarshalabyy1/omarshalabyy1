<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Featured projects. Argus, data engineering and AI: a retail supply chain platform that recovers supplier deduction losses with a daily Airflow pipeline, a PostgreSQL bronze, silver and gold warehouse, reconciliation to the cent and a rules knowledge base. Bosch Car Service, data engineering and BI developer: multi-branch Excel templates feeding a Python ETL into a SQL Server warehouse with Power BI dashboards at zero licence cost.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .cap { font-size: 14px; fill: #94A3B8; }
    .name { font-size: 25px; font-weight: 700; fill: #FFFFFF; }
    .tag { font-size: 11.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .sub { font-size: 13.5px; font-weight: 600; }
    .lab { font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; }
    .body { font-size: 13.5px; fill: #E2E8F0; }
    .chip { font-size: 11.5px; font-weight: 600; fill: #CBD5E1; text-anchor: middle; }
  </style>
  <rect width="1000" height="560" rx="22" fill="url(#bg)"/>
  <text x="30" y="44" class="title">Featured projects</text>
  <text x="30" y="68" class="cap">Real systems, real business problems.</text>
  <rect x="30" y="92" width="455" height="440" rx="16" fill="#14B8A6" fill-opacity="0.07" stroke="#14B8A6" stroke-opacity="0.6"/><rect x="30" y="92" width="455" height="6" rx="3" fill="#14B8A6"/><text x="56" y="140" class="name">Argus</text><rect x="56" y="154" width="137" height="24" rx="12" fill="#3B82F6" fill-opacity="0.22" stroke="#3B82F6" stroke-opacity="0.8"/><text x="124.5" y="170" class="tag">Data Engineering</text><rect x="201" y="154" width="36" height="24" rx="12" fill="#A855F7" fill-opacity="0.22" stroke="#A855F7" stroke-opacity="0.8"/><text x="219.0" y="170" class="tag">AI</text><text x="56" y="206" class="sub" fill="#14B8A6">Retail supply chain  |  supplier deduction recovery</text><text x="56" y="238" class="lab" fill="#F87171">PROBLEM</text><text x="56" y="258" class="body">Suppliers lose money to retailer deductions</text><text x="56" y="277" class="body">they never see, explain or dispute.</text><text x="56" y="316" class="lab" fill="#34D399">WHAT I BUILT</text><circle cx="61" cy="334" r="3.5" fill="#14B8A6"/><text x="74" y="338" class="body">Daily Airflow pipeline: retailer API + portal capture</text><circle cx="61" cy="360" r="3.5" fill="#14B8A6"/><text x="74" y="364" class="body">PostgreSQL warehouse in bronze, silver, gold layers</text><circle cx="61" cy="386" r="3.5" fill="#14B8A6"/><text x="74" y="390" class="body">Every short payment reconciled to the cent</text><circle cx="61" cy="412" r="3.5" fill="#14B8A6"/><text x="74" y="416" class="body">Rules knowledge base explains each deduction</text><circle cx="61" cy="438" r="3.5" fill="#14B8A6"/><text x="74" y="442" class="body">Review app in Streamlit; built with AI coding agents</text><text x="56" y="480" class="lab" fill="#94A3B8">STACK</text><rect x="56" y="492" width="54" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="83.0" y="508" class="chip">Python</text><rect x="117" y="492" width="80" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="157.0" y="508" class="chip">PostgreSQL</text><rect x="204" y="492" width="60" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="234.0" y="508" class="chip">Airflow</text><rect x="271" y="492" width="80" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="311.0" y="508" class="chip">Playwright</text><rect x="358" y="492" width="73" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="394.5" y="508" class="chip">Streamlit</text><rect x="515" y="92" width="455" height="440" rx="16" fill="#22C55E" fill-opacity="0.07" stroke="#22C55E" stroke-opacity="0.6"/><rect x="515" y="92" width="455" height="6" rx="3" fill="#22C55E"/><text x="541" y="140" class="name">Bosch Car Service</text><rect x="541" y="154" width="137" height="24" rx="12" fill="#3B82F6" fill-opacity="0.22" stroke="#3B82F6" stroke-opacity="0.8"/><text x="609.5" y="170" class="tag">Data Engineering</text><rect x="686" y="154" width="108" height="24" rx="12" fill="#F2C811" fill-opacity="0.22" stroke="#F2C811" stroke-opacity="0.8"/><text x="740.0" y="170" class="tag">BI Developer</text><text x="541" y="206" class="sub" fill="#22C55E">Automotive service  |  multi-branch operations</text><text x="541" y="238" class="lab" fill="#F87171">PROBLEM</text><text x="541" y="258" class="body">Each branch reported in its own Excel files,</text><text x="541" y="277" class="body">with no single view of daily operations.</text><text x="541" y="316" class="lab" fill="#34D399">WHAT I BUILT</text><circle cx="546" cy="334" r="3.5" fill="#22C55E"/><text x="559" y="338" class="body">Validated Excel templates with VBA for every branch</text><circle cx="546" cy="360" r="3.5" fill="#22C55E"/><text x="559" y="364" class="body">Near real-time Python ETL into SQL Server</text><circle cx="546" cy="386" r="3.5" fill="#22C55E"/><text x="559" y="390" class="body">Warehouse: staging, facts and dimensions, views</text><circle cx="546" cy="412" r="3.5" fill="#22C55E"/><text x="559" y="416" class="body">Idempotent upserts, row hashing, audit log</text><circle cx="546" cy="438" r="3.5" fill="#22C55E"/><text x="559" y="442" class="body">Power BI dashboards on a zero-licence-cost stack</text><text x="541" y="480" class="lab" fill="#94A3B8">STACK</text><rect x="541" y="492" width="86" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="584.0" y="508" class="chip">Excel + VBA</text><rect x="634" y="492" width="54" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="661.0" y="508" class="chip">Python</text><rect x="695" y="492" width="80" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="735.0" y="508" class="chip">SQL Server</text><rect x="782" y="492" width="41" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="802.5" y="508" class="chip">SSMS</text><rect x="830" y="492" width="67" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#94A3B8" stroke-opacity="0.35"/><text x="863.5" y="508" class="chip">Power BI</text>
</svg>
