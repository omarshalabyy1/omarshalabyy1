<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="From messy data to results in 6 steps, like a restaurant kitchen: 1 Collect, groceries arrive (data pipelines); 2 Clean, wash and chop (ETL and data quality); 3 Organize, a labeled pantry (warehouse and data modeling); 4 Ask, ask the chef anything (RAG, AI agents and NLP); 5 Act, service runs itself (automation with Airflow); 6 See, see what sells (Power BI and Excel).">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; text-anchor: middle; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; text-anchor: start; }
    .sub { font-size: 14px; fill: #94A3B8; text-anchor: start; }
    .verb { font-size: 19px; font-weight: 700; fill: #FFFFFF; }
    .like { font-size: 13px; font-style: italic; fill: #94A3B8; }
    .chip { font-size: 12px; font-weight: 600; fill: #E2E8F0; }
    .num { font-size: 11px; font-weight: 700; fill: #0B1220; }
    .flow { fill: none; stroke: url(#line); stroke-width: 3; stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .ico { fill: none; stroke: #FFFFFF; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1000" height="320" rx="22" fill="url(#bg)"/>
  <text x="40" y="50" class="title">From messy data to results in 6 steps</text>
  <text x="40" y="74" class="sub">Think of it like a restaurant kitchen.</text>

  <path class="flow" d="M105 150H895"/>
  <circle r="6" fill="#FFFFFF">
    <animateMotion dur="5s" repeatCount="indefinite" path="M105 150H895"/>
  </circle>

  <!-- 1 Collect -->
  <circle cx="105" cy="150" r="40" fill="#3B82F6" fill-opacity="0.25" stroke="#3B82F6" stroke-width="2"/>
  <path class="ico" d="M105 131v24M96 147l9 9 9-9M89 155v10h32v-10"/>
  <circle cx="136" cy="119" r="10" fill="#3B82F6"/><text x="136" y="123" class="num">1</text>
  <text x="105" y="222" class="verb">Collect</text>
  <text x="105" y="244" class="like">groceries arrive</text>
  <rect x="45" y="262" width="120" height="26" rx="13" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-opacity="0.6"/>
  <text x="105" y="279" class="chip">Data pipelines</text>

  <!-- 2 Clean -->
  <circle cx="263" cy="150" r="40" fill="#0EA5E9" fill-opacity="0.25" stroke="#0EA5E9" stroke-width="2"/>
  <path class="ico" d="M247 134h32l-12 14v14l-8 4v-18z"/>
  <circle cx="294" cy="119" r="10" fill="#0EA5E9"/><text x="294" y="123" class="num">2</text>
  <text x="263" y="222" class="verb">Clean</text>
  <text x="263" y="244" class="like">wash and chop</text>
  <rect x="198" y="262" width="130" height="26" rx="13" fill="#0EA5E9" fill-opacity="0.2" stroke="#0EA5E9" stroke-opacity="0.6"/>
  <text x="263" y="279" class="chip">ETL + data quality</text>

  <!-- 3 Organize -->
  <circle cx="421" cy="150" r="40" fill="#14B8A6" fill-opacity="0.25" stroke="#14B8A6" stroke-width="2"/>
  <ellipse class="ico" cx="421" cy="136" rx="15" ry="5"/>
  <path class="ico" d="M406 136v26a15 5 0 0 0 30 0v-26M406 149a15 5 0 0 0 30 0"/>
  <circle cx="452" cy="119" r="10" fill="#14B8A6"/><text x="452" y="123" class="num">3</text>
  <text x="421" y="222" class="verb">Organize</text>
  <text x="421" y="244" class="like">a labeled pantry</text>
  <rect x="349" y="262" width="144" height="26" rx="13" fill="#14B8A6" fill-opacity="0.2" stroke="#14B8A6" stroke-opacity="0.6"/>
  <text x="421" y="279" class="chip">Warehouse + modeling</text>

  <!-- 4 Ask -->
  <circle cx="579" cy="150" r="40" fill="#A855F7" fill-opacity="0.25" stroke="#A855F7" stroke-width="2"/>
  <path class="ico" d="M562 133h34a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4h-20l-8 7v-7h-6a4 4 0 0 1-4-4v-18a4 4 0 0 1 4-4z"/>
  <text x="579" y="153" font-size="16" font-weight="700" fill="#FFFFFF">?</text>
  <circle cx="610" cy="119" r="10" fill="#A855F7"/><text x="610" y="123" class="num">4</text>
  <text x="579" y="222" class="verb">Ask</text>
  <text x="579" y="244" class="like">ask the chef anything</text>
  <rect x="507" y="262" width="144" height="26" rx="13" fill="#A855F7" fill-opacity="0.2" stroke="#A855F7" stroke-opacity="0.6"/>
  <text x="579" y="279" class="chip">RAG + agents + NLP</text>

  <!-- 5 Act -->
  <circle cx="737" cy="150" r="40" fill="#F59E0B" fill-opacity="0.25" stroke="#F59E0B" stroke-width="2"/>
  <path d="M741 130l-14 22h10l-4 18 16-24h-10z" fill="#FFFFFF"/>
  <circle cx="768" cy="119" r="10" fill="#F59E0B"/><text x="768" y="123" class="num">5</text>
  <text x="737" y="222" class="verb">Act</text>
  <text x="737" y="244" class="like">service runs itself</text>
  <rect x="667" y="262" width="140" height="26" rx="13" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-opacity="0.6"/>
  <text x="737" y="279" class="chip">Automation (Airflow)</text>

  <!-- 6 See -->
  <circle cx="895" cy="150" r="40" fill="#22C55E" fill-opacity="0.25" stroke="#22C55E" stroke-width="2"/>
  <path class="ico" d="M877 165h36"/>
  <rect x="880" y="152" width="7" height="12" rx="1.5" fill="#FFFFFF"/>
  <rect x="891" y="144" width="7" height="20" rx="1.5" fill="#FFFFFF"/>
  <rect x="902" y="136" width="7" height="28" rx="1.5" fill="#FFFFFF"/>
  <circle cx="926" cy="119" r="10" fill="#22C55E"/><text x="926" y="123" class="num">6</text>
  <text x="895" y="222" class="verb">See</text>
  <text x="895" y="244" class="like">see what sells</text>
  <rect x="835" y="262" width="120" height="26" rx="13" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E" stroke-opacity="0.6"/>
  <text x="895" y="279" class="chip">Power BI + Excel</text>
</svg>
